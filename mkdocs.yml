site_name: EUC Spreadsheet Uplift Docs
site_description: Documentation for EUC Spreadsheet Uplift
site_author: Vincent Chong
docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.inlinehilite
  - admonition
  - pymdownx.details
  - pymdownx.snippets:
      base_path: "."
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google

nav:
  - Home: index.md
  - Architecture:
      - Component Interfaces: 01_Architecture/08-component-interfaces.md
      - API Gateway: 01_Architecture/01-api-gateway.md
      - AI Service: 01_Architecture/02-ai-service.md
      - Google Sheets UI: 01_Architecture/04-google-sheets-ui.md
      - Egress LLM: 01_Architecture/05-egress-llm.md
      - End-to-End Sequence: 01_Architecture/09-end-to-end-sequence.md
  - Governance:
      - Security & Auditability: Governance/07-security-auditability.md
  - Lineage:
      - End-to-End Tracing: Lineage/09-end-to-end-tracing.md
      - Promotion and Provenance: Lineage/promotion-and-provenance.md
  - Specs:
      - Consumption Map: specs/README.md
      - Program Sequence: specs/program-sequence.md
      - TODO: specs/TODO.md
  - API Reference:
      - Config API: 03_Reference/api_config.md
      - Errors API: 03_Reference/api_errors.md
      - Guardrails API: 03_Reference/api_guardrails.md
      - Request Context API: 03_Reference/api_request_context.md
      - Error Code Spec: 03_Reference/error_code_spec.md
      - MAS API: 03_Reference/MAS_API.md
