# Optimized for prek - https://j178.dev
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key

  - repo: local
    hooks:
      - id: detect-local-home-path
        name: Detect local /home path
        entry: /home/
        language: pygrep
        types: [text]
        exclude: ^\.pre-commit-config\.yaml$
      - id: trufflehog
        name: TruffleHog (System)
        entry: bash -c "git ls-files --exclude-standard --cached --others | xargs -d '\n' trufflehog filesystem --fail --config=.trufflehog/rules.yaml"
        language: system
        pass_filenames: false
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        args: ["-lll"] # Only show high-severity issues (like SQLi)
        additional_dependencies:
          - pbr
  - repo: local
    hooks:
      - id: pyright
        name: Pyright (System)
        entry: bash -c 'pyright apps/ai_service'
        language: system
        pass_filenames: false
        types: [python]

  - repo: https://github.com/bridgecrewio/checkov
    rev: "3.2.327" # Replace with the latest Checkov version tag
    hooks:
      - id: checkov
        always_run: true
        pass_filenames: false
        language_version: python3.12
        args:
          [
            --framework,
            dockerfile,
            "-d",
            "infrastructure",
            "-d",
            "apps",
            "--quiet",
          ]
        # --quiet ensures it only prints output when it finds a failure
